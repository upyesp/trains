# Cloudflare Worker — live board proxy (ADR-0003 / ADR-0004).
# Proxies Real-Time Trains with a 30s per-station cache + stale-while-error,
# keeping the refresh token server-side (RTT forbids client-side tokens; it is
# exchanged for a short-lived access token per ADR-0004).
#
# Deploy:     npm run worker:deploy
# Local dev:  npm run worker:dev   (put RTT_TOKEN in worker/.dev.vars)

name = "trains-api"
main = "worker/entry.ts"
compatibility_date = "2026-07-27"

# Non-secret configuration. The bearer token is a secret, set with:
#   wrangler secret put RTT_TOKEN
[vars]
TIME_WINDOW = "120"   # minutes of board fetched per RTT call
TTL_SEC = "30"        # per-station cache freshness (ADR-0003)
RTT_API_BASE = "https://data.rtt.io"
# NG API version, confirmed via /api/info on the free tier (research/rtt-api.md sec 6).
RTT_API_VERSION = "2026-07-25"
# Comma-separated CORS allowlist (ADR-0003). Reflected from the request Origin;
# defaults to the production site if unset.
CORS_ORIGIN = "https://www.viptrains.org"

# Contact form (see worker/entry.ts). The Resend API key is a SECRET, set with:
#   wrangler secret put RESEND_API_KEY
# CONTACT_FROM must be an address on a domain verified in Resend (add
# viptrains.org to Resend and confirm its DNS records first).
CONTACT_FROM = "VIP Trains <contact@viptrains.org>"
CONTACT_TO = "***REMOVED***"
# Sliding-window throttle for form submissions, per visitor IP.
CONTACT_RATE_WINDOW_MS = "600000"
CONTACT_RATE_MAX = "3"
