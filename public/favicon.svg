<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Trains — live departure board">
  <!-- The dark "live screen" tile -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <!-- Signal accent bar (the board's amber top stripe) -->
  <rect x="6" y="6" width="20" height="2.6" rx="1.3" fill="#f0b429"/>
  <!-- Schedule rows (chalk), descending width = a mini departure board -->
  <rect x="6" y="11.5" width="15" height="2.4" rx="1" fill="#e6edf3"/>
  <rect x="6" y="16.6" width="19" height="2.4" rx="1" fill="#e6edf3"/>
  <rect x="6" y="21.7" width="11" height="2.4" rx="1" fill="#e6edf3"/>
  <!-- Platform / status indicator -->
  <rect x="23.6" y="21.7" width="2.6" height="2.4" rx="1" fill="#f0b429"/>
</svg>
