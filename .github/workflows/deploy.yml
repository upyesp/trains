name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: read the repo, write Pages, OIDC trust for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push cancels a superseded run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        # No secret needed: the frontend only knows the Worker's public URL.
        # The RTT token lives in the Worker (Cloudflare secret RTT_TOKEN).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
